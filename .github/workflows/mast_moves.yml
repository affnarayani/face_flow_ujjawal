name: Mast Moves Post

on:
  schedule:
    - cron: "30 4 * * *"   # IST 10:00 AM
    - cron: "30 10 * * *"  # IST 04:00 PM
    - cron: "30 16 * * *"  # IST 10:00 PM
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. PULL CODE
      # =========================
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }} # Pushing ke liye PAT zaroori ho sakta hai

      # =========================
      # 2. SETUP PYTHON
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # =========================
      # 3. INSTALL DEPENDENCIES
      # =========================
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install playwright playwright-stealth cryptography python-dotenv requests
          # Agar requirements.txt hai toh: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

      # =========================
      # 4. RUN BOT
      # =========================
      - name: Run bot
        env:
          DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
        run: python mast_moves.py

      # =========================
      # 5. COMMIT & PUSH CHANGES
      # =========================
      - name: Commit & Push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Saari changes add karein (Specifically deleted videos from mast_moves/)
          git add mast_moves/
          
          # Agar posted_content.json abhi bhi use ho raha hai toh usse bhi add karein
          if [ -f "posted_content.json" ]; then
            git add posted_content.json
          fi

          # Change check karein aur commit karein
          git diff --cached --quiet || (git commit -m "Post successful: Video removed [auto]" && git push)